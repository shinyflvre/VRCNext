name: Publish release artifacts

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-appimage:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Linux AppImage
        run: ./build/appimage.sh

      - name: Upload Linux release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: publish/linux/*.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: true

  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Publish Windows x64
        shell: pwsh
        run: dotnet publish VRCNext.csproj -c Release -r win-x64 --self-contained true -o publish/windows -p:VRCNextVrcndbKey="$env:VRCNEXT_VRCNDB_KEY" -p:VRCNextHypeRateApiKey="$env:VRCNEXT_HYPERATE_API_KEY"
        env:
          VRCNEXT_VRCNDB_KEY: ${{ secrets.VRCNEXT_VRCNDB_KEY }}
          VRCNEXT_HYPERATE_API_KEY: ${{ secrets.VRCNEXT_HYPERATE_API_KEY }}

      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path publish/windows/* -DestinationPath publish/VRCNext-${{ github.ref_name }}-win-x64.zip

      - name: Upload Windows release artifact
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: publish/VRCNext-*-win-x64.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
